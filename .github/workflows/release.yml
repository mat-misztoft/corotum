name: Final release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Rebuild every target from this source. Do not reuse pipeline-proof binaries.
# v0.1 artifacts are unsigned. Signing and notarization are out of scope.

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run test:e2e
      - run: bun run typecheck
      - run: bun run web:build
      - run: bun run docs:check

  build:
    name: compile-${{ matrix.id }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: bun-darwin-arm64
            id: darwin-arm64
          - target: bun-darwin-x64
            id: darwin-x64
          - target: bun-linux-arm64
            id: linux-arm64
          - target: bun-linux-x64
            id: linux-x64
          - target: bun-windows-x64
            id: windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun ./tooling/release-build.ts --target ${{ matrix.target }}
      - name: Run linux-x64 final binary
        if: matrix.id == 'linux-x64'
        run: bun run verify:cli dist/compile/corotum-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: compile-${{ matrix.id }}
          path: dist/compile/
          if-no-files-found: error

  validate:
    name: validate-final-layout
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: compile-*
          path: dist/compile
          merge-multiple: true
      - run: bun ./tooling/release-build.ts --assemble-only
      - run: bun run release:verify
      - run: bun run release:smoke-installers
      - run: bun run web:build
      - run: bun run web:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: final-r2-layout
          path: dist/r2/releases/
          if-no-files-found: error

  deploy:
    name: deploy-workerd
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run web:build
      - run: bun run release:deploy
        env:
          RELEASE_REQUIRE_DEPLOY: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
      - run: bun run release:smoke-endpoints
        env:
          COROTUM_SMOKE_ORIGIN: ${{ secrets.COROTUM_SMOKE_ORIGIN }}
          RELEASE_REQUIRE_AUTH_SMOKE: "1"

  publish:
    name: publish-final-release
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: final-r2-layout
          path: dist/r2/releases
      - run: bun run release:verify
      - run: bun run release:upload
        env:
          RELEASE_REQUIRE_UPLOAD: "1"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
